[package]
name = "ironcalc-desktop"
version = "0.1.0"
description = "IronCalc Desktop - Offline spreadsheet application"
authors = ["IronCalc Team"]
edition = "2021"

[lib]
name = "ironcalc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Локальная зависимость на ironcalc для нативных операций с файлами
ironcalc = { path = "../../../xlsx" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Изолируем от родительского workspace
[workspace]

[profile.release]
lto = true
opt-level = "s"
strip = true
