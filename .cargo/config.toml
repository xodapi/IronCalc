# Конфигурация Cargo для оффлайн-сборки IronCalc
[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

# Альтернативная конфигурация для оффлайн-режима
[net]
git-fetch-with-cli = true

# Настройки сборки
[build]
# Задаем количество потоков для сборки
jobs = 4

# Оптимизации для выпуска
[target.'cfg(all())']
# Для статической линковки
rustflags = ["-C", "target-feature=+crt-static"]